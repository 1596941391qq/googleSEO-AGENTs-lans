<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: white;
        }

        .mobile-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .mobile-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            z-index: 100;
        }

        .content {
            padding: 80px 16px 96px;
            min-height: 100vh;
        }

        .test-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .hamburger {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }

        .nav-item.active {
            color: #34d399;
        }

        @media (min-width: 768px) {
            .mobile-header,
            .mobile-bottom-nav {
                display: none;
            }

            .content {
                padding: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- 移动端顶部导航 -->
    <div class="mobile-header">
        <div class="hamburger">☰</div>
        <div style="font-weight: bold;">Niche Digger</div>
        <div style="width: 44px;"></div>
    </div>

    <!-- 主内容 -->
    <div class="content">
        <div class="test-card">
            <h2 style="margin-bottom: 12px;">移动端测试页面</h2>
            <p style="color: rgba(255, 255, 255, 0.6);">
                如果你能看到顶部和底部的导航栏，说明移动端组件正常工作。
            </p>
        </div>

        <div class="test-card">
            <h3 style="margin-bottom: 8px;">✅ 顶部导航栏</h3>
            <p style="color: rgba(255, 255, 255, 0.6); font-size: 14px;">
                固定在顶部，包含汉堡菜单和标题
            </p>
        </div>

        <div class="test-card">
            <h3 style="margin-bottom: 8px;">✅ 底部导航栏</h3>
            <p style="color: rgba(255, 255, 255, 0.6); font-size: 14px;">
                固定在底部，包含4个主要导航项
            </p>
        </div>

        <div class="test-card">
            <h3 style="margin-bottom: 8px;">📱 测试说明</h3>
            <p style="color: rgba(255, 255, 255, 0.6); font-size: 14px;">
                1. 在移动端（< 768px）应该显示顶部和底部导航<br>
                2. 在桌面端（>= 768px）应该隐藏这些导航<br>
                3. 内容区域应该有正确的 padding
            </p>
        </div>
    </div>

    <!-- 移动端底部导航 -->
    <div class="mobile-bottom-nav">
        <div class="nav-item active">
            <div style="margin-bottom: 4px;">🌐</div>
            <div style="font-size: 10px;">我的网站</div>
        </div>
        <div class="nav-item">
            <div style="margin-bottom: 4px;">#</div>
            <div style="font-size: 10px;">网站数据</div>
        </div>
        <div class="nav-item">
            <div style="margin-bottom: 4px;">📈</div>
            <div style="font-size: 10px;">任务看板</div>
        </div>
        <div class="nav-item">
            <div style="margin-bottom: 4px;">📤</div>
            <div style="font-size: 10px;">发布</div>
        </div>
    </div>
</body>
</html>
