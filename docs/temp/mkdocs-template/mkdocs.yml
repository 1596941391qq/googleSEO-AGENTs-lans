# MkDocs 最小配置 - NicheDigger PSEO
site_name: "{{site_name}}"
site_url: "{{site_url}}"
site_description: "{{site_description}}"

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.sections
    - search.suggest
    - toc.integrate

docs_dir: docs
use_directory_urls: true

nav:
  - Home: index.md
# 新文章将在此处自动添加

markdown_extensions:
  - tables
  - toc:
      permalink: true
