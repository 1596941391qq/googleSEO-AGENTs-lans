<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Google SEO Intelligent Agent</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        font-size: 15px;
      }
      @media (min-width: 1280px) {
        html {
          font-size: 16px;
        }
      }
      @media (min-width: 1536px) {
        html {
          font-size: 16px;
        }
      }
      @media (min-width: 1920px) {
        html {
          font-size: 18px;
        }
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: #0a0a0a;
        font-size: 1rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-mono {
        font-family: "JetBrains Mono", monospace;
      }
      /* Grid overlay effect - 更精致 */
      .grid-overlay {
        background-image:
          linear-gradient(rgba(52, 211, 153, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(52, 211, 153, 0.02) 1px, transparent 1px);
        background-size: 50px 50px;
        background-position: 0 0, 0 0;
      }
      /* Hide all scrollbars while maintaining scroll functionality */
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      *::-webkit-scrollbar {
        display: none;  /* Chrome, Safari and Opera */
      }

      /* Legacy custom-scrollbar class - now also hidden */
      .custom-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      .custom-scrollbar::-webkit-scrollbar {
        display: none;  /* Chrome, Safari and Opera */
      }

      /* Visible scrollbar for terminal/console */
      .visible-scrollbar {
        -ms-overflow-style: auto !important;
        scrollbar-width: thin !important;
        scrollbar-color: rgba(52, 211, 153, 0.3) transparent !important;
      }
      .visible-scrollbar::-webkit-scrollbar {
        display: block !important;
        width: 6px !important;
      }
      .visible-scrollbar::-webkit-scrollbar-track {
        background: transparent !important;
      }
      .visible-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(52, 211, 153, 0.3) !important;
        border-radius: 20px !important;
      }
      .visible-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(52, 211, 153, 0.6) !important;
      }

      /* Shimmer animation for energy flow effect */
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* Apple-like spring animation */
      @keyframes spring-in {
        0% {
          opacity: 0;
          transform: scale(0.9) translateY(10px);
        }
        50% {
          transform: scale(1.02) translateY(-2px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      /* Fade in with slide */
      @keyframes fade-slide-in {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Glow pulse animation */
      @keyframes glow-pulse {
        0%, 100% {
          box-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
        }
        50% {
          box-shadow: 0 0 30px rgba(52, 211, 153, 0.5);
        }
      }

      /* Apply animations */
      .animate-spring-in {
        animation: spring-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .animate-fade-slide-in {
        animation: fade-slide-in 0.4s ease-out;
      }

      .animate-glow-pulse {
        animation: glow-pulse 2s ease-in-out infinite;
      }

      /* Smooth transitions for all interactive elements */
      button, a, input, select, textarea {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Glass morphism utility */
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Performance optimization */
      .will-change-transform {
        will-change: transform;
      }

      .will-change-opacity {
        will-change: opacity;
      }

      /* 移动端安全区域支持 */
      @supports (padding: max(0px)) {
        .safe-area-inset-bottom {
          padding-bottom: max(8px, env(safe-area-inset-bottom));
        }

        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom);
        }
      }

      /* 移动端触摸优化 */
      @media (max-width: 768px) {
        * {
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
        }

        /* 防止移动端双击缩放 */
        button, a {
          touch-action: manipulation;
        }

        /* 移动端内容区域适配 */
        body {
          overflow-x: hidden;
        }
      }

      /* 移动端字体大小调整 */
      @media (max-width: 640px) {
        html {
          font-size: 14px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
          "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
